<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D racing-helmet hero — demo</title>
<!-- Three.js is the one dependency for this effect (loaded from a CDN). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, Segoe UI, Roboto, system-ui, sans-serif; }

  .helmet-hero {
    position: relative; overflow: hidden;
    height: 100vh;
    background: radial-gradient(120% 120% at 50% 35%, #f3efe7 0%, #e6ddcf 55%, #d8cdb9 100%);
  }
  .helmet-hero canvas[data-helmet-hero] {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;
  }
  .helmet-hero__content {
    position: relative; z-index: 1; pointer-events: none;
    height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 6vmin;
  }
  .helmet-hero__content h1 {
    font-size: clamp(2.5rem, 9vw, 7rem); line-height: .92;
    letter-spacing: -0.03em; color: #1a1a1a; font-weight: 800;
  }
  .helmet-hero__content p {
    margin-top: 1rem; color: #444; font-size: clamp(.9rem, 2vw, 1.1rem);
    letter-spacing: .04em; text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) {
    .helmet-hero canvas[data-helmet-hero] {}
  }
</style>
</head>
<body>
  <section class="helmet-hero">
    <canvas data-helmet-hero data-parallax="0.4" data-spin="0.2"></canvas>
    <div class="helmet-hero__content">
      <h1>HELMET<br>HERO</h1>
      <p>move the cursor &rarr; the helmet follows</p>
    </div>
  </section>

  <script src="vanilla.js"></script>
</body>
</html>
